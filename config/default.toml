# Default configuration for a trading-game session.
# Copy and edit for experiments; every session archives the config it ran with.

[session]
name = "dev"
label = "experiment"          # free-form tag, e.g. "control-random", "culture-A"
mode = "agent"                # agent (motor regions + feedback) | reservoir (trained readout)
# Episodes are sized to the instrument's cost structure: an /MBT round trip
# costs ~90 points (spread + commissions), and the typical move only clears
# that from roughly 5-30 minutes out, so positions must be holdable for tens
# of minutes. 15-minute episodes are the shortest that let the culture express
# a trade at the horizon where being right is worth money.
episodes = 4
steps_per_episode = 900       # env steps per episode (1 step ~= step_interval_s); 15 min at 1 Hz
step_interval_s = 1.0         # seconds between action opportunities (~1 Hz per CL gridworld paper)
rest_s = 120                  # rest/baseline period before and between episodes
warmup_s = 120                # pre-session rest: baseline collection + short-window top-up.
                              # The strip's long windows are fed by pre-roll history
                              # (source.preroll), not by this rest.
baseline_interactions = 60    # baseline windows used for spike-count normalization
loop_hz = 20                  # CL closed-loop tick rate (budget 50 ms per tick)
jitter_tolerance_ticks = 2    # loop may fall this many ticks behind the device before the CL SDK raises
                              # TimeoutError (SDK default is 0: one slow tick would end a hardware session)
accelerated = false           # true = decouple from wall clock (simulator only, non-live sources)
score_metric = "pnl_after_costs"   # pnl_after_costs | directional_accuracy
output_dir = "data/sessions"
record_cl = true              # also produce the CL HDF5 recording
console = true                # live console view

[market]
source = "synthetic"          # synthetic | replay | live

[market.synthetic]
regime = "sine"               # sine | trend | trend_noise | mean_revert | random_walk
seed = 42
start_price = 78000.0         # ~BTC level so synthetic runs share MBT-scaled parameters
spread = 40.0                 # quoted spread in points (observed /MBT off-peak: 35-45)
dt_s = 0.1                    # internal simulation resolution
# signal parameters. The sine is the learnability sanity check, so its signal
# must live at the holding-period scale where trades clear costs: a 30-minute
# period with trough-to-crest 800 points (~9x the round-trip cost). A 120 s
# period is invisible to holding-period horizons -- at h = period/2 a perfectly
# accurate predictor enters at the zero-capture phase and loses the spread.
amplitude = 400.0             # sine amplitude (points)
period_s = 1800.0             # sine period
drift_per_s = 1.0             # trend drift (points/s)
mean_revert_rate = 0.05       # OU reversion rate (1/s)
noise_vol = 7.0               # noise sigma (points per sqrt(s)); ~BTC realized vol at seconds scale
snr = 4.0                     # signal-to-noise dial: scales signal relative to noise (higher = easier)

[market.replay]
path = ""                     # path to a .jsonl or .jsonl.gz file from the replay library
speed = 1.0                   # playback speed multiplier
start_offset_s = 0.0

[market.live]
product_code = "MBT"          # CME product; front month auto-resolved (MBT = micro bitcoin, 24/7 since 2026-05-29)
streamer_symbol = ""          # optional explicit override, e.g. "BTC/USD:CXTALP" for spot crypto
roll_cutoff_days = 7          # never trade a contract within N days of its last trading day (MBT is monthly)
roll_check_interval_s = 3600  # re-check the front month this often; on change: flatten, resubscribe, rotate recording
stale_quote_s = 60            # no quote/trade events for this long -> game idles instead of trading a frozen book (0 = off)
outage_timeout_s = 600        # the stream reconnects by itself (the DXLink quote token expires every 24 h); the game
                              # idles meanwhile, and gives up if the outage outlasts this (0 = retry forever)

[instrument]
symbol = "/MBT"
point_value = 0.1             # $ per point per contract (0.1 BTC, quoted in USD per bitcoin)
tick_size = 5.0               # $5 per bitcoin minimum tick = $0.50 per contract

[broker]
kind = "paper"                # paper | tastytrade (live phase)
commission_per_side = 2.00    # $ per contract per side: 0.75 commission + 0.30 clearing + exchange/NFA estimate (verify on statement)
slippage_ticks = 0            # extra ticks beyond crossing the spread

[neural]
channels = 64
sdk_seed = 42                 # CL_SDK_RANDOM_SEED for deterministic simulator runs (-1 = unseeded)

# Electrode layout: channel indices 0..channels-1, no overlaps.
# Sensory groups receive stimulation; motor regions are read for decoding.
# CL1 hardware reserves 5 of the 64 channels: 0, 7, 56, 63 (unused grid
# corners) and 4 (measurement reference). Never assign them — the simulator
# accepts them but on real hardware those stims are silently dead.
#
# The momentum and imbalance groups are chronotopic strips: channel order IS
# the timescale axis (short -> long, matching momentum_windows_s and
# imbalance_windows_s), so the lists below must stay ordered and exactly as
# long as their window ladders. Rows 1-2 carry the "up" valence (up-momentum,
# bid-heavy book), rows 4-5 the "down" valence (ask-heavy book, down-momentum),
# and row 3 is left empty as the guard between them: blending is wanted
# *along* a strip and across same-valence strips (a rising price and a
# bid-heavy book agree), destructive *across* valence.
[neural.layout.sensory]
momentum_up = [8, 9, 10, 11, 12, 13, 14, 15]      # row 1: 30s -> 8h
imbalance_bid = [16, 17, 18, 19, 20, 21, 22, 23]  # row 2: bid-heavy book, 1s -> 2min
imbalance_ask = [32, 33, 34, 35, 36, 37, 38, 39]  # row 4: ask-heavy book, 1s -> 2min
momentum_down = [40, 41, 42, 43, 44, 45, 46, 47]  # row 5: 30s -> 8h
# Row 0 holds the scalar channels, one electrode each, "good/long" left of the
# reserved centre and "bad/short" right of it: position long, PnL up, position
# flat | reference | PnL down, position short.
position_long = [1]
pnl_up = [2]
position_flat = [3]
pnl_down = [5]
position_short = [6]

# Motor on the bottom two rows, maximally far from the strips (three rows of
# separation); symmetric 2x3 blocks so the buy/sell differential count is
# unbiased. Cols 1-6 dodge the reserved corners 56/63.
[neural.layout.motor]
buy = [49, 50, 51, 57, 58, 59]
sell = [52, 53, 54, 60, 61, 62]

[neural.encoding]
# Defaults follow Cortical Labs' large-scale optimization (arXiv:2605.13315)
f_min_hz = 4.0
f_max_hz = 40.0
amplitude_ua = 2.5
pulse_width_us = 80.0
position_rate_hz = 8.0        # fixed rate for the place-coded position group
pnl_channel_enabled = true
# Chronotopic strip: one electrode per window, ordered short -> long. Must be
# ascending and the same length as the momentum_up/down layout groups.
# The ladder starts at 30 s because shorter moves can't clear /MBT round-trip
# costs (~90 points), and tops out at 8 h where typical moves run ~4x costs.
# The long windows are fed by pre-roll history at session start (replay: data
# before start_offset_s; live: DXLink candle backfill; synthetic: generated),
# so the whole strip is live from the first episode.
momentum_windows_s = [30.0, 60.0, 300.0, 900.0, 1800.0, 3600.0, 14400.0, 28800.0]
momentum_scale = 1.2          # points/s that saturates momentum AT momentum_scale_window_s
momentum_scale_window_s = 30.0  # calibration window (~1 sigma of BTC 30s drift); other
                              # windows scale as 1/sqrt(window), so every strip
                              # channel spans the same 4-40 Hz range
pnl_scale_points = 200.0      # unrealized PnL (points) that saturates the pnl signal ($20 on MBT)
# Book-imbalance strip: (bid_size - ask_size) / (bid_size + ask_size) at the
# top of the book, time-averaged over each window, one electrode per window
# short -> long. The book's information lives at seconds and is gone by five
# minutes, so this ladder runs 1 s .. 2 min. Sign picks imbalance_bid /
# imbalance_ask, tanh(mean / scale) sets the rate; each window has its own
# scale because the typical |mean| shrinks with the window at a rate that
# differs by product (no shared law). Silence until a window holds 3/4 of its
# span. Values below are /MBT's; the gate's --calibrate-scale recomputes them.
imbalance_windows_s = [1.0, 5.0, 10.0, 15.0, 20.0, 40.0, 60.0, 120.0]
imbalance_scales = [0.55, 0.38, 0.34, 0.32, 0.31, 0.29, 0.27, 0.25]

[neural.decoding]
normalization = "ratio"       # ratio | zscore (vs. pre-episode baseline spontaneous activity)
threshold = 0.25              # differential activity needed to act (else hold)
min_baseline_count = 1.0      # floor for baseline means to avoid divide-by-zero
readout_path = ""             # reservoir mode: path to trained readout bundle (.joblib)
readout_prob_threshold = 0.6  # reservoir mode: min probability to act

[neural.reward]
# hybrid (default): full feedback on trade close (net of costs) PLUS holding
# feedback -- while a position is open, its unrealized PnL is evaluated every
# holding_interval_s and, outside holding_deadband_points, earns mini
# predictable (winner) or unpredictable (loser) stimulation. Culture credit
# assignment is seconds-scale, so close-time-only feedback cannot shape entry
# decisions across a 15-minute hold; the holding feedback makes the
# contingency available at every moment -- and a losing position becomes an
# aversive stimulus the culture can terminate at will by closing (closed-loop
# stimulus removal, the best-replicated culture conditioning protocol).
# per_tick (experimental arm): mini feedback on 1 s mark-to-market deltas.
timing = "hybrid"             # per_tick | per_trade | hybrid
shuffle = false               # true = control condition: valence resampled from past true outcomes (same rates, no contingency)
deadband_points = 10.0        # closed-trade net points (and per_tick deltas) inside this band get no feedback
holding_interval_s = 20.0     # hybrid: evaluate the open position's unrealized PnL this often
holding_deadband_points = 100.0  # ~the round-trip cost hurdle (spread + commissions ~90 pts): reward begins
                              # once the trade has cleared its costs, punishment once it has lost more than
                              # them; the scratch zone (including the entry's half-spread hole) is silence
predictable_hz = 100.0
predictable_burst_ms = 80.0
predictable_bursts = 5        # full reward: N bursts spread over feedback window
predictable_window_s = 1.0
unpredictable_s = 2.0         # full punishment: noise duration
unpredictable_rate_hz = 5.0   # per-site event rate for random stimulation
pause_after_loss_s = 1.0      # extra quiet pause after punishment before play resumes
feedback_amplitude_ua = 2.5
